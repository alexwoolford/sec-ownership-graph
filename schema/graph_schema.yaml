# =============================================================================
# Graph Schema Contract — Single Source of Truth
# =============================================================================
#
# The canonical schema for the SEC ownership-relationship graph (`secgraph`). Documentation and
# validation both derive from this file, and `tests/unit/test_schema_consistency.py` scans every
# .py file to fail the build if any Cypher references a label or relationship type not declared
# here. So: declare it here FIRST, then write the query.
#
# Four node labels, nine relationship types. Everything joins on hard keys (CIK / CUSIP-9),
# never on fuzzy name matching.
#
# Derived (materialized) relationships — computed, not filed:
#   SHARES_DIRECTOR  two boards share >=1 human director        (materialize_interlock_edges.py)
#   CONTROLS         verified >=50% 13D stake                   (materialize_control_edges.py)
#   SAME_ENTITY_AS   CIK identity bridge; makes chains transitive (same script)
#   CO_TARGETS       two 13D filers co-target >=2 issuers       (materialize_cotarget_edges.py)
#
# How to regenerate docs:
#   python scripts/generate_schema_docs.py --execute

# ---------------------------------------------------------------------------
# Node labels, unique keys, required & optional properties with types
# ---------------------------------------------------------------------------
nodes:
  Company:
    unique_key: cik
    description: >
      A public issuer that files with the SEC. The universe is SEC filers with a ticker
      (see scripts/load_company_universe.py); every ownership edge attaches to one of these.
      NOTE: no revenue and no true market cap. Two size measures exist, and they are different
      claims: `total_assets_usd` is a real balance-sheet figure from the Financial Statement Data
      Sets (~63% of the universe), while `institutional_value_usd` is a 13F free-float PROXY
      (~75%). `size_usd` coalesces them and `size_source` says which one applied. See each
      property, and docs/reference_architecture_secgraph.md "Honest limits".
    required_properties:
      cik: {type: String, description: "SEC Central Index Key — the hard key everything joins on"}
      name: {type: String, description: "Company legal name"}
      loaded_at: {type: DateTime, description: "When node was loaded"}
    optional_properties:
      ticker: {type: String, description: "Stock ticker symbol"}
      sector: {type: String, description: "Business sector derived from the SIC code"}
      sic_code: {type: String, description: "SIC industry code (from EDGAR)"}
      state_of_incorp: {type: String, description: "State/country of incorporation (from EDGAR)"}
      ownership_component: {type: Long, description: "WCC component id over the ownership-interlock graph (GDS)"}
      institutional_value_usd:
        type: Float
        description: >
          Size PROXY, not a market cap: total 13F-reported institutional dollars in this issuer
          for one quarter (sum of HOLDS.value_usd). Exists so structural results can be ranked
          by materiality — a $95B control relationship and a $30 one are not the same finding.
          Three limits, all load-bearing: (1) ABSENT for ~25% of the universe (no 13F coverage),
          and a null means "not institutionally held", never zero; (2) measures FREE FLOAT, so it
          understates exactly the concentrated-ownership issuers control chains are about —
          conservative, never a false positive; (3) ETFs are in the universe and 13F filers report
          them, so SPY/QQQ rank high on other people's money. Written by materialize_materiality.py.
      institutional_value_period:
        type: Date
        description: >
          The 13F report_period institutional_value_usd was summed over. Required for
          auditability: the figure is one quarter's snapshot, not a running total, and 13F has a
          2024 coverage step-up — so the period must travel with the number.
      total_assets_usd:
        type: Float
        description: >
          Total consolidated assets as reported on the balance sheet (XBRL tag "Assets", uom USD,
          qtrs=0, no segment/coreg breakdown), from the SEC Financial Statement Data Sets and
          keyed on the CIK in sub.txt. Exists because institutional_value_usd measures FREE
          FLOAT, which by construction understates the concentrated-ownership issuers this graph
          is about: EchoStar carries $60.9B of assets and is 51.8% controlled, yet has no 13F
          coverage at all. Limits: (1) ABSENT for ~42% of the universe — no 10-K/10-Q in the
          staged window covers ETFs, funds and many foreign filers, and a null means "not
          reported here", never zero; (2) NOT comparable across sectors — a bank's assets are its
          balance sheet, so JPMorgan's $4.0T is not "bigger than" a $200B industrial in any
          economically meaningful sense; (3) it is a point-in-time balance, not market value, and
          says nothing about equity value or leverage. Written by load_company_financials.py.
      total_assets_period:
        type: Date
        description: >
          The XBRL ddate total_assets_usd was read from — the balance-sheet date, not the filing
          date. Required for auditability for the same reason as institutional_value_period: the
          figure is one instant, and the staged window moves with --quarters-fsds.
      total_assets_accession:
        type: String
        description: >
          The SEC accession number of the 10-K/10-Q the assets figure came from, so the number is
          citable per the evidence-or-abstain rule. This is strictly better than
          institutional_value_usd, which is an aggregate over thousands of 13F edges and carries
          no single citation. Also the tiebreak that makes the figure reproducible: measured on
          2026q1, one (cik, ddate) pair reports two different values from two accessions (an
          original and an amendment), so without a total order two builds over identical inputs
          could publish different figures. Highest accession — the later filing — wins.
      size_usd:
        type: Float
        description: >
          The combined size measure used for filtering and ranking:
          coalesce(total_assets_usd, institutional_value_usd). Prefers the real balance sheet and
          falls back to 13F float, which lifts coverage from 75% (13F alone) to ~85%. Neither
          input is modified, so published float-based figures stay comparable. ALWAYS read
          size_source alongside it — a $60.9B assets figure and a $60.9B float figure are
          different claims. Null means neither source could size the issuer; such rows are
          excluded from size-filtered results and the exclusion count is reported rather than
          silently dropped. Written by materialize_materiality.py.
      size_source:
        type: String
        description: >
          Which input produced size_usd: "dera_assets" (balance-sheet Assets) or
          "institutional_13f" (13F free-float proxy). Absent when size_usd is null. This is what
          keeps a size-ranked answer auditable — without it the two measures are
          indistinguishable in output despite meaning different things.

  Insider:
    unique_key: cik
    description: "SEC Form 3/4/5 reporting owner (director/officer/10% holder), CIK-keyed at source"
    required_properties:
      cik: {type: String, description: "SEC Central Index Key of the reporting owner (unique key)"}
      name: {type: String, description: "Reporting owner name as filed"}
      loaded_at: {type: DateTime, description: "When node was loaded"}

  InstitutionalManager:
    unique_key: cik
    description: "SEC Form 13F institutional investment manager, CIK-keyed"
    required_properties:
      cik: {type: String, description: "SEC Central Index Key of the 13F filer (unique key)"}
      name: {type: String, description: "Manager name as filed"}
      loaded_at: {type: DateTime, description: "When node was loaded"}

  BeneficialOwner:
    unique_key: owner_key
    description: "SEC Schedule 13D/13G >5% beneficial owner (filer); CIK if resolved, else name-slug"
    required_properties:
      owner_key: {type: String, description: "CIK if resolvable, else a name-slug (unique key)"}
      name: {type: String, description: "Filer name as it appears in the submission header"}
      loaded_at: {type: DateTime, description: "When node was loaded"}
    optional_properties:
      cik: {type: String, description: "Filer CIK when resolvable from the submission header"}
      resolved: {type: Boolean, description: "True if owner_key is a CIK, False if a name-slug"}
      is_custodial: {type: Boolean, description: "True for broker/custodian/index hubs that bridge unrelated activists. Labelled (never deleted) so the fact survives; excluded at coalition projection time for precision."}
      coalition_id: {type: Long, description: "Activist coalition component id (GDS WCC over CO_TARGETS, custodial hubs excluded)"}

# ---------------------------------------------------------------------------
# Relationship types: source → target, required/optional properties
# ---------------------------------------------------------------------------
relationships:
  # --- Filed relationships: straight from SEC forms ---
  DIRECTOR_OF:
    pattern: "(Insider)-[:DIRECTOR_OF]->(Company)"
    description: "Reporting owner is a director of the issuer (SEC Form 3/4/5)"
    source: Insider
    target: Company
    required_properties: [filing_date, source, loaded_at]
    optional_properties: [accession_number, first_seen, last_seen]

  OFFICER_OF:
    pattern: "(Insider)-[:OFFICER_OF]->(Company)"
    description: "Reporting owner is an officer of the issuer (SEC Form 3/4/5)"
    source: Insider
    target: Company
    required_properties: [filing_date, source, loaded_at]
    optional_properties: [accession_number, officer_title, first_seen, last_seen]

  TEN_PCT_OWNER_OF:
    pattern: "(Insider)-[:TEN_PCT_OWNER_OF]->(Company)"
    description: "Reporting owner holds >10% of the issuer (SEC Form 3/4/5)"
    source: Insider
    target: Company
    required_properties: [filing_date, source, loaded_at]
    optional_properties: [accession_number, first_seen, last_seen]

  # --- Derived relationships: materialized so traversal happens in the database ---
  SHARES_DIRECTOR:
    pattern: "(Company)-[:SHARES_DIRECTOR]->(Company)"
    description: "Two operating boards share >=1 human director (derived from DIRECTOR_OF; board-interlock edge, stored undirected once with id(a)<id(b))"
    source: Company
    target: Company
    required_properties: [director_count, source, computed_at]
    optional_properties: [via_ciks]

  CONTROLS:
    pattern: "(BeneficialOwner)-[:CONTROLS]->(Company)"
    description: "Verified >=50% control of the issuer (derived from BENEFICIAL_OWNER_OF 13D edges where control_class='control'; self-filings excluded). Materialized so the transitive control chain is a real variable-depth Cypher traversal rather than a client-side walk; chains continue where a controlled Company's CIK also exists as a BeneficialOwner."
    source: BeneficialOwner
    target: Company
    required_properties: [percent_of_class, source, computed_at]
    optional_properties: [accession_number, filing_date]

  SAME_ENTITY_AS:
    pattern: "(Company)-[:SAME_ENTITY_AS]->(BeneficialOwner)"
    description: "The Company and the BeneficialOwner are the same legal entity, matched on identical CIK (a hard key, never a name match). Purely structural: it lets a control chain continue past an intermediate holding company that both IS controlled and DOES control, so (root)-[:CONTROLS|SAME_ENTITY_AS*]->(target) traverses the full pyramid in Cypher. Carries no ownership semantics of its own."
    source: Company
    target: BeneficialOwner
    required_properties: [source, computed_at]
    optional_properties: [cik]

  INFLUENCES:
    pattern: "(BeneficialOwner)-[:INFLUENCES]->(Company)"
    description: >
      A 13D stake at or above a Federal Reserve control-presumption tier (12 CFR 225.2(e)):
      10 / 15 / 25 / 50 percent. DELIBERATELY SEPARATE FROM `CONTROLS`, which stays at >=50% so
      that "control" keeps meaning control — a 25% holder has influence, blocking rights and
      often a board designee, but not control, and relabelling it invites a correct objection.
      Exists because a >=50% single stake is structurally anti-selected for large caps: an issuer
      with a majority holder has little float, so the >=50% set was finding illiquidity as much as
      control. Median issuer size rises monotonically as the tier falls, and at 25% the set
      includes Berkshire, Walmart, Charter and Ferrari.
      CAVEAT that must travel with it: `percent_of_class` is percent of the class covered by the
      filing, NOT voting power. Several of the largest names here are dual-class (Berkshire, the
      Liberty complex, Carvana, Sea), where economic and voting stakes diverge — so the 25%-of-
      voting test cannot be evaluated cleanly from this data. `board_seat` is the second,
      independent limb of 225.2(e): true when the same CIK also currently sits on the board via
      Form 3/4/5. Self-filings excluded, as in `CONTROLS`.
    source: BeneficialOwner
    target: Company
    required_properties: [percent_of_class, tier, source, computed_at]
    optional_properties: [accession_number, filing_date, board_seat, board_seat_last_seen]

  CO_TARGETS:
    pattern: "(BeneficialOwner)-[:CO_TARGETS]->(BeneficialOwner)"
    description: "Two 13D filers co-target >=2 of the same issuers (derived activist co-targeting edge, stored undirected once with a.cik<b.cik). Substrate for the wolf-pack coalition component; custodial/broker hubs are labelled is_custodial on the node and excluded at projection time rather than deleted."
    source: BeneficialOwner
    target: BeneficialOwner
    required_properties: [shared_target_count, source, computed_at]
    optional_properties: [shared_target_ciks]

  BENEFICIAL_OWNER_OF:
    pattern: "(BeneficialOwner)-[:BENEFICIAL_OWNER_OF]->(Company)"
    description: >
      >5% beneficial owner of the issuer (SEC Schedule 13D/13G). ONE edge per
      (owner, company, filing_type), so a filer's whole 13D history on an issuer collapses
      here. filing_date/accession_number therefore report the EARLIEST ORIGINAL (non-/A)
      filing — when the position was actually disclosed — while first_seen/last_seen keep the
      full observed span and amendment_count shows how much history the edge stands in for.
      Reporting the last-written filing instead manufactured false convergences (amendments to
      years-old stakes looked like fresh arrivals).
    source: BeneficialOwner
    target: Company
    required_properties: [filing_type, filing_date, source, loaded_at]
    # percent_of_class + the control_* / *_voting / pct_* props are written by
    # control_extraction.py onto the >=5% ownership edge (control_class='control' when the
    # verified stake is >=50% — the substrate for the transitive control-chain win).
    # pct_source records WHICH rule produced the percent (aggregate_prose / row13 / prose /
    # llm / rejected_below_13d_threshold), because presence-verification alone could not tell
    # a filing group's total from one affiliated vehicle's row.
    optional_properties:
      [
        percent_of_class,
        accession_number,
        control_class,
        sole_voting,
        shared_voting,
        pct_verified,
        pct_source,
        control_extracted_at,
        first_seen,
        last_seen,
        amendment_count,
        filing_is_original,
      ]

  HOLDS:
    pattern: "(InstitutionalManager)-[:HOLDS]->(Company)"
    description: >
      13F reported holding of the issuer by an institutional manager, keyed by
      report_period so each quarter is a distinct edge (a position time series,
      not a latest-only snapshot). Slice/compare quarter-over-quarter on
      report_period to see accumulation/trimming.
      IMPORTANT: value_usd/shares are SHARE OWNERSHIP only. 13F also reports option positions,
      and their notional is carried separately in call_notional_usd / put_notional_usd —
      an option is a position, not a stake. Conflating them (reading VALUE without PUTCALL)
      made a market maker holding 67 shares of Eversource look like its largest owner at
      $18.68B. Roughly 7% of all reported 13F dollars are options, concentrated in
      market-maker books, so the distortion lands hard on specific issuers.
    source: InstitutionalManager
    target: Company
    required_properties: [report_period, filing_date, source, loaded_at]
    optional_properties:
      [
        value_usd,
        shares,
        call_notional_usd,
        put_notional_usd,
        cusip,
        accession_number,
      ]

# ---------------------------------------------------------------------------
# Required constraints (UNIQUE)
# ---------------------------------------------------------------------------
constraints:
  - name: unique_company
    label: Company
    property: cik
    type: UNIQUENESS
  - name: unique_insider_cik
    label: Insider
    property: cik
    type: UNIQUENESS
  - name: unique_institutional_manager_cik
    label: InstitutionalManager
    property: cik
    type: UNIQUENESS
  - name: unique_beneficial_owner_key
    label: BeneficialOwner
    property: owner_key
    type: UNIQUENESS

# ---------------------------------------------------------------------------
# Required indexes (RANGE, VECTOR, FULLTEXT)
# ---------------------------------------------------------------------------
indexes:
  range:
    - label: Company
      property: ticker
    - label: Company
      property: sector
    - label: Company
      property: sic_code
    - label: Insider
      property: name
    - label: InstitutionalManager
      property: name
    - label: BeneficialOwner
      property: name
